<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Curriculum vitae of Mijin Goo.">
  <title>Mijin Goo - CV</title>
  <link rel="icon" type="image/jpeg" href="/assets/img/prof_pic.jpg">
  <link rel="canonical" href="https://go0leum.github.io/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
</head>
<body>
<main class="simple-cv" id="simple-cv" data-resume-url="/assets/json/resume.json">
  <p class="cv-loading" role="status">Loading resume...</p>
</main>

<style>
  :root { color-scheme: light; scroll-behavior: smooth; }
  body { margin: 0; background: #fff; color: #171717; }
  .simple-cv {
    --cv-ink: #171717;
    --cv-muted: #626262;
    --cv-rule: #dedede;
    box-sizing: border-box;
    max-width: 900px;
    margin: 0 auto 5rem;
    padding: 0 24px;
    color: var(--cv-ink);
    background: #fff;
    font-family: "DM Sans", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.65;
  }
  .simple-cv *, .simple-cv *::before, .simple-cv *::after { box-sizing: border-box; }
  .simple-cv h1, .simple-cv h2, .simple-cv h3, .simple-cv p { color: var(--cv-ink); }
  .simple-cv a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .simple-cv a:hover { color: var(--cv-muted); }
  .cv-loading, .cv-error { color: var(--cv-muted) !important; }
  .cv-header { padding: 2.5rem 0 2rem; border-bottom: 1px solid var(--cv-rule); }
  .cv-intro { display: flex; align-items: center; gap: 2rem; }
  .cv-photo { flex: 0 0 196px; width: 196px; height: 250px; object-fit: cover; object-position: center 38%; }
  .cv-bio { min-width: 0; max-width: 620px; }
  .cv-name { margin: 0; font-size: clamp(1.9rem, 3.4vw, 2.4rem); font-weight: 600; letter-spacing: -.025em; line-height: 1.2; }
  .cv-label { margin: .35rem 0 0; color: var(--cv-muted) !important; font-size: .96rem; }
  .cv-summary { max-width: 580px; margin: .85rem 0 0; font-size: .98rem; line-height: 1.75; white-space: pre-line; }
  .cv-contact { display: flex; flex-wrap: wrap; gap: .35rem 1rem; margin-top: .9rem; color: var(--cv-muted); font-size: .88rem; }
  .cv-social { display: flex; flex-wrap: wrap; gap: .35rem 1rem; margin-top: .4rem; font-size: .88rem; }
  .cv-nav {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    gap: 1.1rem;
    overflow-x: auto;
    padding: .7rem 0;
    background: #fff;
    border-bottom: 1px solid var(--cv-rule);
    scrollbar-width: none;
  }
  .cv-nav::-webkit-scrollbar { display: none; }
  .cv-nav a { flex: 0 0 auto; padding: .25rem 0; border-bottom: 1px solid transparent; color: var(--cv-muted); font-size: .85rem; text-decoration: none; }
  .cv-nav a:hover, .cv-nav a:focus-visible { color: var(--cv-ink); border-color: var(--cv-ink); }
  .cv-section { display: grid; grid-template-columns: 145px minmax(0, 1fr); gap: 2rem; align-items: start; padding: 1.8rem 0; border-bottom: 1px solid var(--cv-rule); scroll-margin-top: 4.25rem; }
  .cv-section-title { margin: .1rem 0 0; font-size: 1rem; font-weight: 600; letter-spacing: 0; text-transform: none; }
  .cv-section-body { min-width: 0; }
  .cv-entry + .cv-entry { margin-top: 1.3rem; }
  .cv-entry-top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  .cv-entry-title { margin: 0; font-size: .98rem; font-weight: 600; line-height: 1.5; }
  .cv-entry-date { flex: 0 0 auto; color: var(--cv-muted); font-size: .82rem; white-space: nowrap; }
  .cv-entry-subtitle { margin: .12rem 0 0; color: var(--cv-muted) !important; font-size: .9rem; }
  .cv-entry-summary { margin: .45rem 0 0; font-size: .94rem; line-height: 1.7; }
  .cv-education-details { display: grid; gap: .35rem; margin: .65rem 0 0; }
  .cv-education-detail { display: grid; grid-template-columns: 105px minmax(0, 1fr); gap: .75rem; margin: 0; font-size: .92rem; }
  .cv-education-detail dt { color: var(--cv-muted); font-weight: 600; }
  .cv-education-detail dd { margin: 0; }
  .cv-tags { display: flex; flex-wrap: wrap; gap: .4rem; margin: .55rem 0 0; color: var(--cv-muted); font-size: .82rem; }
  .cv-tags span { padding: .13rem .45rem; background: #f5f5f5; border-radius: 2px; }
  .cv-highlights .cv-section-body { display: grid; grid-column: 2; gap: 1.1rem; }
  .cv-highlights-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.2rem; }
  .cv-highlight-label { margin: 0 0 .55rem; color: var(--cv-muted) !important; font-size: .76rem; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; }
  .cv-interest-list, .cv-skill-list { display: grid; gap: .65rem; }
  .cv-interest-item { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem .6rem; }
  .cv-interest-name, .cv-skill-name { font-size: .9rem; font-weight: 600; }
  .cv-interest-detail { color: var(--cv-muted); font-size: .83rem; }
  .cv-skill-item { padding-left: .7rem; border-left: 2px solid #dedede; }
  .cv-skill-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem .55rem; }
  .cv-level { color: var(--cv-muted); font-size: .78rem; }
  .cv-certificates { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: .6rem; }
  .cv-certificate { min-width: 0; padding: .7rem .8rem; background: #f7f7f7; border-radius: 3px; }
  .cv-certificate-name { margin: 0; font-size: .9rem; font-weight: 600; }
  .cv-certificate-meta { display: flex; justify-content: space-between; gap: .7rem; margin: .2rem 0 0; color: var(--cv-muted) !important; font-size: .8rem; }
  .cv-project-grid { display: grid; grid-template-columns: 1fr; gap: .7rem; }
  .cv-project-card { min-width: 0; padding: .9rem 1rem; background: #f7f7f7; border-left: 2px solid #bdbdbd; cursor: default; }
  .cv-project-card .cv-entry-summary { margin-bottom: 0; }
  @media (prefers-reduced-motion: reduce) { :root { scroll-behavior: auto; } }
  @media (max-width: 600px) {
    .simple-cv { margin-bottom: 3rem; padding: 0 18px; font-size: .96rem; }
    .cv-header { padding-top: 1.4rem; }
    .cv-intro { align-items: flex-start; gap: 1rem; }
    .cv-photo { flex-basis: 122px; width: 122px; height: 160px; }
    .cv-name { font-size: clamp(1.65rem, 7vw, 2rem); }
    .cv-summary { margin-top: .65rem; font-size: .9rem; line-height: 1.65; }
    .cv-entry-top { display: block; }
    .cv-entry-date { display: block; margin-top: .1rem; }
    .cv-education-detail { grid-template-columns: 82px minmax(0, 1fr); }
    .cv-section { grid-template-columns: 1fr; gap: .75rem; padding: 1.35rem 0; }
    .cv-section-title { margin: 0; }
    .cv-highlights .cv-section-body { grid-column: 1; }
    .cv-nav { gap: .8rem; }
  }
</style>

<script>
  (() => {
    const root = document.getElementById("simple-cv");
    const make = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined && text !== null) node.textContent = text;
      return node;
    };
    const link = (label, href) => {
      if (!href) return make("span", "", label);
      const node = make("a", "", label);
      node.href = href;
      node.target = "_blank";
      node.rel = "noopener noreferrer";
      return node;
    };
    const dateRange = (item) => [item.startDate, item.endDate].filter(Boolean).join(" to ") || item.date || item.year || "";
    const addTags = (parent, values) => {
      if (!Array.isArray(values) || !values.length) return;
      const tags = make("div", "cv-tags");
      values.forEach((value) => tags.append(make("span", "", value)));
      parent.append(tags);
    };
    const addSection = (title, entries, renderEntry, id) => {
      if (!Array.isArray(entries) || !entries.length) return;
      const section = make("section", "cv-section");
      section.id = id;
      section.append(make("h2", "cv-section-title", title));
      const body = make("div", "cv-section-body");
      entries.forEach((item) => body.append(renderEntry(item)));
      section.append(body);
      root.append(section);
    };
    const addNavigation = (data) => {
      const links = [
        ["Focus", "highlights", (data.interests || []).length || (data.skills || []).length || (data.certificates || []).length],
        ["Education", "education", (data.education || []).length],
        ["Experience", "experience", (data.work || []).length],
        ["Publications", "publications", (data.publications || []).length],
        ["Projects", "projects", (data.projects || []).length]
      ].filter(([, , hasItems]) => hasItems);
      if (!links.length) return;
      const nav = make("nav", "cv-nav");
      nav.setAttribute("aria-label", "Jump to CV section");
      links.forEach(([label, id]) => {
        const anchor = make("a", "", label);
        anchor.href = `#${id}`;
        nav.append(anchor);
      });
      root.append(nav);
    };
    const addHighlights = (data) => {
      const interests = Array.isArray(data.interests) ? data.interests : [];
      const skills = Array.isArray(data.skills) ? data.skills : [];
      const certificates = Array.isArray(data.certificates) ? data.certificates : [];
      if (!interests.length && !skills.length && !certificates.length) return;
      const section = make("section", "cv-section cv-highlights");
      section.id = "highlights";
      section.append(make("h2", "cv-section-title", "Focus & Credentials"));
      const body = make("div", "cv-section-body");
      const grid = make("div", "cv-highlights-grid");
      if (interests.length) {
        const group = make("div", "cv-highlight-group");
        group.append(make("h3", "cv-highlight-label", "Interests"));
        const list = make("div", "cv-interest-list");
        interests.forEach((item) => {
          const row = make("div", "cv-interest-item");
          row.append(make("span", "cv-interest-name", item.name || ""));
          (item.keywords || []).forEach((keyword) => row.append(make("span", "cv-interest-detail", keyword)));
          list.append(row);
        });
        group.append(list);
        grid.append(group);
      }
      if (skills.length) {
        const group = make("div", "cv-highlight-group");
        group.append(make("h3", "cv-highlight-label", "Skills"));
        const list = make("div", "cv-skill-list");
        skills.forEach((item) => {
          const row = make("div", "cv-skill-item");
          const top = make("div", "cv-skill-top");
          top.append(make("span", "cv-skill-name", item.name || ""));
          if (item.level) top.append(make("span", "cv-level", item.level));
          row.append(top);
          addTags(row, item.keywords);
          list.append(row);
        });
        group.append(list);
        grid.append(group);
      }
      if (grid.childNodes.length) body.append(grid);
      if (certificates.length) {
        const group = make("div", "cv-highlight-group");
        group.append(make("h3", "cv-highlight-label", "Certificates"));
        const cards = make("div", "cv-certificates");
        certificates.forEach((item) => {
          const card = make("article", "cv-certificate");
          card.append(make("h3", "cv-certificate-name", item.name || ""));
          const meta = make("p", "cv-certificate-meta");
          if (item.issuer) meta.append(make("span", "", item.issuer));
          if (item.date) meta.append(make("time", "", item.date));
          if (meta.childNodes.length) card.append(meta);
          cards.append(card);
        });
        group.append(cards);
        body.append(group);
      }
      section.append(body);
      root.append(section);
    };
    const entry = (title, subtitle, date, summary, tags, href) => {
      const box = make("article", "cv-entry");
      const top = make("div", "cv-entry-top");
      const heading = make("h3", "cv-entry-title");
      heading.append(href ? link(title || "", href) : make("span", "", title || ""));
      top.append(heading);
      if (date) top.append(make("time", "cv-entry-date", date));
      box.append(top);
      if (subtitle) box.append(make("p", "cv-entry-subtitle", subtitle));
      if (summary) box.append(make("p", "cv-entry-summary", summary));
      addTags(box, tags);
      return box;
    };
    const educationEntry = (item) => {
      const box = entry(item.institution, item.studyType, dateRange(item), "", [], item.url);
      const details = [];
      if (Array.isArray(item.area) && item.area.length) details.push(["Field of study", item.area.join(", ")]);
      if (item.advisor) details.push(["Advisor", item.advisor]);
      if (item.score) details.push(["GPA", item.score]);
      if (item.location) details.push(["Location", item.location]);
      if (details.length) {
        const list = make("dl", "cv-education-details");
        details.forEach(([label, value]) => {
          const row = make("div", "cv-education-detail");
          row.append(make("dt", "", label), make("dd", "", value));
          list.append(row);
        });
        box.append(list);
      }
      return box;
    };
    const render = (data) => {
      const basics = data.basics || {};
      const header = make("header", "cv-header");
      const intro = make("div", "cv-intro");
      if (basics.image) {
        const photo = make("img", "cv-photo");
        photo.src = basics.image;
        photo.alt = basics.name ? `${basics.name} portrait` : "Portrait";
        photo.loading = "eager";
        intro.append(photo);
      }
      const bio = make("div", "cv-bio");
      bio.append(make("h1", "cv-name", basics.name || "Resume"));
      if (basics.label) bio.append(make("p", "cv-label", basics.label));
      if (basics.summary) bio.append(make("p", "cv-summary", basics.summary));
      const contact = make("div", "cv-contact");
      if (basics.email) contact.append(link(basics.email, `mailto:${basics.email}`));
      if (basics.location) contact.append(make("span", "", [basics.location.city, basics.location.countryCode].filter(Boolean).join(", ")));
      if (basics.url) contact.append(link("Website", basics.url));
      if (contact.childNodes.length) bio.append(contact);
      if (Array.isArray(basics.social) && basics.social.length) {
        const social = make("nav", "cv-social");
        social.setAttribute("aria-label", "Social profiles");
        basics.social.forEach((profile) => social.append(link(profile.network || profile.username || profile.url, profile.url)));
        bio.append(social);
      }
      intro.append(bio);
      header.append(intro);
      root.replaceChildren(header);
      addNavigation(data);

      addHighlights(data);
      addSection("Education", data.education, educationEntry, "education");
      addSection("Experience", data.work, (item) => entry(item.position, item.name, dateRange(item), item.summary, item.highlights, item.url), "experience");
      addSection("Publications", data.publications, (item) => {
        const subtitle = [item.journal, item.volume && `Vol. ${item.volume}`, item.pages && `pp. ${item.pages}`, item.year].filter(Boolean).join(" | ");
        const box = entry(item.name, subtitle, "", item.publisher, []);
        if (item.doi) box.append(link("DOI", item.doi));
        return box;
      }, "publications");
      if (Array.isArray(data.projects) && data.projects.length) {
        const section = make("section", "cv-section");
        section.id = "projects";
        section.append(make("h2", "cv-section-title", "Projects"));
        const grid = make("div", "cv-project-grid");
        data.projects.forEach((item) => {
          const card = make("article", "cv-project-card");
          const top = make("div", "cv-entry-top");
          top.append(make("h3", "cv-entry-title", item.name || ""));
          const date = dateRange(item);
          if (date) top.append(make("time", "cv-entry-date", date));
          card.append(top);
          if (item.summary) card.append(make("p", "cv-entry-summary", item.summary));
          addTags(card, item.highlights);
          grid.append(card);
        });
        const body = make("div", "cv-section-body");
        body.append(grid);
        section.append(body);
        root.append(section);
      }
    };

    fetch(`${root.dataset.resumeUrl}?v=${Date.now()}`, { cache: "no-store" })
      .then((response) => { if (!response.ok) throw new Error("Resume data could not be loaded."); return response.json(); })
      .then(render)
      .catch(() => { root.replaceChildren(make("p", "cv-error", "Resume data could not be loaded.")); });
  })();
</script>
</body>
</html>
