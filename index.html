<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Curriculum vitae of Mijin Goo.">
  <title>Mijin Goo - CV</title>
  <link rel="canonical" href="https://go0leum.github.io/">
</head>
<body>

<main class="simple-cv" id="simple-cv" data-resume-url="/assets/json/resume.json">
  <p class="cv-loading" role="status">Loading resume...</p>
</main>

<style>
  body { margin: 0; background: #fff; }
  .simple-cv {
    --cv-ink: #171717;
    --cv-muted: #626262;
    --cv-rule: #dedede;
    max-width: 780px;
    padding: 0 24px;
    margin: 0 auto 5rem;
    color: var(--cv-ink);
    background: #fff;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 1rem;
    line-height: 1.65;
  }
  body.cv-page { background: #fff !important; color: #171717 !important; }
  body.cv-page .container[role="main"] { background: #fff; }
  .simple-cv *, .simple-cv *::before, .simple-cv *::after { box-sizing: border-box; }
  .simple-cv h1, .simple-cv h2, .simple-cv h3, .simple-cv p { color: var(--cv-ink); }
  .simple-cv a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .simple-cv a:hover { color: var(--cv-muted); }
  .cv-loading, .cv-error { color: var(--cv-muted) !important; }
  .cv-header { padding: 2.5rem 0 2rem; border-bottom: 1px solid var(--cv-rule); }
  .cv-name { margin: 0; font-size: clamp(2.2rem, 6vw, 3.4rem); font-weight: 650; letter-spacing: -.045em; line-height: 1.08; }
  .cv-label { margin: .5rem 0 0; color: var(--cv-muted) !important; font-size: 1.1rem; }
  .cv-summary { max-width: 680px; margin: 1.25rem 0 0; }
  .cv-contact { display: flex; flex-wrap: wrap; gap: .35rem 1rem; margin-top: 1.25rem; color: var(--cv-muted); font-size: .92rem; }
  .cv-social { display: flex; flex-wrap: wrap; gap: .4rem 1rem; margin-top: .75rem; font-size: .92rem; }
  .cv-section { padding: 1.8rem 0; border-bottom: 1px solid var(--cv-rule); }
  .cv-section-title { margin: 0 0 1.2rem; font-size: .82rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  .cv-entry + .cv-entry { margin-top: 1.5rem; }
  .cv-entry-top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  .cv-entry-title { margin: 0; font-size: 1.05rem; font-weight: 650; }
  .cv-entry-date { flex: 0 0 auto; color: var(--cv-muted); font-size: .88rem; }
  .cv-entry-subtitle, .cv-entry-meta { margin: .15rem 0 0; color: var(--cv-muted) !important; font-size: .93rem; }
  .cv-entry-summary { margin: .55rem 0 0; }
  .cv-tags { display: flex; flex-wrap: wrap; gap: .35rem .8rem; margin: .55rem 0 0; color: var(--cv-muted); font-size: .88rem; }
  .cv-tags span + span::before { content: "·"; margin-right: .8rem; }
  @media (max-width: 600px) {
    .simple-cv { margin-bottom: 3rem; font-size: .96rem; }
    .cv-header { padding-top: 1rem; }
    .cv-entry-top { display: block; }
    .cv-entry-date { display: block; margin-top: .1rem; }
  }
</style>

<script>
  (() => {
    const root = document.getElementById("simple-cv");
    document.body.classList.add("cv-page");
    const make = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined && text !== null) node.textContent = text;
      return node;
    };
    const link = (label, href) => {
      if (!href) return make("span", "", label);
      const node = make("a", "", label);
      node.href = href;
      node.target = "_blank";
      node.rel = "noopener noreferrer";
      return node;
    };
    const dateRange = (item) => [item.startDate, item.endDate].filter(Boolean).join(" – ") || item.date || item.year || "";
    const joined = (value) => Array.isArray(value) ? value.join(" · ") : (value || "");
    const addTags = (parent, values) => {
      if (!Array.isArray(values) || !values.length) return;
      const tags = make("div", "cv-tags");
      values.forEach((value) => tags.append(make("span", "", value)));
      parent.append(tags);
    };
    const addSection = (title, entries, renderEntry) => {
      if (!Array.isArray(entries) || !entries.length) return;
      const section = make("section", "cv-section");
      section.append(make("h2", "cv-section-title", title));
      entries.forEach((item) => section.append(renderEntry(item)));
      root.append(section);
    };
    const entry = (title, subtitle, date, summary, meta, tags, href) => {
      const box = make("article", "cv-entry");
      const top = make("div", "cv-entry-top");
      const heading = make("h3", "cv-entry-title");
      heading.append(href ? link(title || "", href) : make("span", "", title || ""));
      top.append(heading);
      if (date) top.append(make("time", "cv-entry-date", date));
      box.append(top);
      if (subtitle) box.append(make("p", "cv-entry-subtitle", subtitle));
      if (meta) box.append(make("p", "cv-entry-meta", meta));
      if (summary) box.append(make("p", "cv-entry-summary", summary));
      addTags(box, tags);
      return box;
    };
    const render = (data) => {
      const basics = data.basics || {};
      const header = make("header", "cv-header");
      header.append(make("h1", "cv-name", basics.name || "Resume"));
      if (basics.label) header.append(make("p", "cv-label", basics.label));
      if (basics.summary) header.append(make("p", "cv-summary", basics.summary));
      const contact = make("div", "cv-contact");
      if (basics.email) contact.append(link(basics.email, `mailto:${basics.email}`));
      if (basics.location) contact.append(make("span", "", [basics.location.city, basics.location.countryCode].filter(Boolean).join(", ")));
      if (basics.url) contact.append(link("Website", basics.url));
      if (contact.childNodes.length) header.append(contact);
      if (Array.isArray(basics.social) && basics.social.length) {
        const social = make("nav", "cv-social");
        social.setAttribute("aria-label", "Social profiles");
        basics.social.forEach((profile) => social.append(link(profile.network || profile.username || profile.url, profile.url)));
        header.append(social);
      }
      root.replaceChildren(header);

      addSection("Experience", data.work, (item) => entry(item.position, item.name, dateRange(item), item.summary, "", item.highlights, item.url));
      addSection("Education", data.education, (item) => entry(item.institution, item.studyType, dateRange(item), "", [joined(item.area), item.advisor, item.score, item.location].filter(Boolean).join(" · "), [], item.url));
      addSection("Projects", data.projects, (item) => entry(item.name, "", dateRange(item), item.summary, "", item.highlights, item.url));
      addSection("Publications", data.publications, (item) => {
        const box = entry(item.name, [item.journal, item.volume && `Vol. ${item.volume}`, item.pages && `pp. ${item.pages}`, item.year].filter(Boolean).join(" · "), "", "", item.publisher, []);
        if (item.doi) box.append(link("DOI", item.doi));
        return box;
      });
      addSection("Certificates", data.certificates, (item) => entry(item.name, item.issuer, dateRange(item), "", "", [], item.url));
      addSection("Skills", data.skills, (item) => entry(item.name, item.level, "", "", "", item.keywords));
      addSection("Interests", data.interests, (item) => entry(item.name, "", "", "", "", item.keywords));
      ["volunteer", "awards", "languages", "references"].forEach((key) => {
        const items = data[key];
        if (Array.isArray(items)) addSection(key, items, (item) => entry(item.name || item.title || item.organization || "", item.position || item.level || item.issuer || "", dateRange(item), item.summary, "", item.highlights || item.keywords));
      });
    };

    fetch(root.dataset.resumeUrl)
      .then((response) => { if (!response.ok) throw new Error("Resume data could not be loaded."); return response.json(); })
      .then(render)
      .catch(() => { root.replaceChildren(make("p", "cv-error", "Resume data could not be loaded.")); });
  })();
</script>
</body>
</html>
